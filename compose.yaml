services:
  relay:
    build:
      context: .
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    environment:
      RELAY_ALLOWED_ORIGINS: ${BAMBICAM_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      RELAY_TRUST_PROXY: 'true'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${BAMBICAM_DOMAIN:-:8080}
      RELAY_UPSTREAM: relay:8787
    ports:
      - "${BAMBICAM_BIND:-127.0.0.1}:8080:8080"
      - "${BAMBICAM_BIND:-127.0.0.1}:80:80"
      - "${BAMBICAM_BIND:-127.0.0.1}:443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
